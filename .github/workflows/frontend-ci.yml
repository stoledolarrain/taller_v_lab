name: Frontend CI — Lint, Build & E2E Tests

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-and-build:
    name: Frontend Lint, Format & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Verificar calidad de código (ESLint)
        run: npm run lint

      - name: Verificar formato de código (Prettier)
        run: npm run format:check

      - name: Compilar proyecto y verificación de tipos (TypeScript + Vite)
        run: npm run build

  e2e-tests:
    name: Playwright End-to-End Tests (PDF Sec. 13)
    needs: lint-and-build
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: 'django-insecure-e2e-ci-test-key-taller-v'
      DJANGO_DEBUG: 'True'
      E2E_API_URL: 'http://127.0.0.1:8000/api/v1'
      E2E_BASE_URL: 'http://localhost:5173'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12 (Backend)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Configurar Node.js 20 (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias de Backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar migraciones en SQLite para E2E
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Iniciar servidor Backend Django en segundo plano
        working-directory: backend
        run: |
          python manage.py runserver 127.0.0.1:8000 &
          python -c "
          import time, urllib.request
          for i in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/v1/auth/me/')
                  break
              except Exception as e:
                  if hasattr(e, 'code') and e.code == 401:
                      print('Backend listo y respondiendo en el puerto 8000.')
                      break
                  time.sleep(1)
          else:
              raise SystemExit('Timeout esperando al backend Django.')
          "

      - name: Instalar dependencias de Frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar binarios y dependencias de Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar Suite E2E de Playwright (7 flujos completos)
        working-directory: frontend
        run: npm run test:e2e

      - name: Subir reporte de Playwright en caso de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Publicar Resumen de Pruebas Frontend en GitHub Actions Summary
        if: always()
        run: |
          echo "## 🎭 Resumen de Verificación y Cobertura — Frontend CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Comando | Descripción | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 **Linter** | \`npm run lint\` | Reglas de estilo ESLint | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 💅 **Formato** | \`npm run format:check\` | Consistencia Prettier | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 **Build & Tipos** | \`npm run build\` | Compilación TypeScript + Vite | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **Playwright E2E** | \`npm run test:e2e\` | 7 Specs de ciclo de vida con UI real | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
