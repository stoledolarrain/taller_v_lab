name: Backend CI — Tests & Verificación

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Backend Lint, Migraciones, Unit, Integration & E2E Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: 'django-insecure-ci-test-key-taller-v'
      DJANGO_DEBUG: 'True'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar configuración de Django (Check)
        run: python manage.py check

      - name: Verificar migraciones pendientes (Makemigrations Check)
        run: python manage.py makemigrations --check --dry-run

      - name: 1. Ejecutar Pruebas Unitarias — Autenticación y Reglas de Negocio (PDF Sec. 11)
        run: pytest apps/authentication/tests/ apps/groups/tests/test_unit_business_rules.py -v --tb=short

      - name: 2. Ejecutar Pruebas de Integración — API REST & Base de Datos (PDF Sec. 12)
        run: pytest apps/groups/tests/test_integration_api.py -v --tb=short

      - name: 3. Ejecutar Pruebas End-to-End (E2E) — Ciclo de Vida Completo (PDF Sec. 13)
        run: pytest apps/groups/tests/test_e2e_flows.py -v --tb=short

      - name: 4. Publicar Resumen de Pruebas en GitHub Actions Summary
        if: always()
        run: |
          echo "## 🚀 Resumen de Verificación y Cobertura — Backend CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Nivel de Prueba | Ubicación | Especificación PDF | Total Tests | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|:---:|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧩 **Unitarias (Auth)** | \`apps/authentication/tests/\` | Autenticación, JWT y Perfil | 16 | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧩 **Unitarias (Negocio)** | \`apps/groups/tests/test_unit_business_rules.py\` | Sección 11 (Invariantes de Dominio) | 10 | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 **Integración (API)** | \`apps/groups/tests/test_integration_api.py\` | Sección 12 (API REST & BD) | 11 | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **End-to-End (E2E)** | \`apps/groups/tests/test_e2e_flows.py\` | Sección 13 (Flujos de Ciclo de Vida) | 7 | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 **TOTAL** | **Suite Completa Backend** | **100% Cobertura de Requerimientos** | **44** | **✅ PASSED** |" >> $GITHUB_STEP_SUMMARY
