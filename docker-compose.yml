services:
  db:
    image: postgres:16-alpine
    container_name: pasanaku_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pasanaku_db}
      POSTGRES_USER: ${DB_USER:-pasanaku_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pasanaku_password}
    ports:
      - "${DB_PORT_FORWARD:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pasanaku_user} -d ${DB_NAME:-pasanaku_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pasanaku_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pasanaku_backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-pasanaku-taller-v}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DB_NAME: ${DB_NAME:-pasanaku_db}
      DB_USER: ${DB_USER:-pasanaku_user}
      DB_PASSWORD: ${DB_PASSWORD:-pasanaku_password}
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pasanaku_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pasanaku_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - pasanaku_net

volumes:
  postgres_data:
    driver: local

networks:
  pasanaku_net:
    driver: bridge
